<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Kalkulator Ilmiah</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/effects.css">
</head>
<body data-theme="default">
<div id="effectLayer" aria-hidden="true"></div>
<main class="app" aria-label="Kalkulator ilmiah">
  <div class="top">
    <h1>Scientific Calculator</h1>
    <button class="mode" id="angleMode" type="button" aria-label="Ubah mode sudut">DEG</button>
  </div>
  <section class="screen">
    <input id="expression" aria-label="Ekspresi matematika" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Masukkan ekspresi…">
    <div id="result" aria-live="polite">0</div>
    <div id="hint">-</div>
  </section>
  <section class="keys" aria-label="Tombol kalkulator">
    <button class="key fn" data-insert="sin(">sin</button><button class="key fn" data-insert="cos(">cos</button><button class="key fn" data-insert="tan(">tan</button><button class="key fn" data-insert="sqrt(">√</button><button class="key op" data-action="backspace">⌫</button>
    <button class="key fn" data-insert="asin(">sin⁻¹</button><button class="key fn" data-insert="acos(">cos⁻¹</button><button class="key fn" data-insert="atan(">tan⁻¹</button><button class="key fn" data-insert="^">xʸ</button><button class="key op" data-action="clear">AC</button>
    <button class="key fn" data-insert="ln(">ln</button><button class="key fn" data-insert="log(">log</button><button class="key fn" data-insert="(">(</button><button class="key fn" data-insert=")">)</button><button class="key op" data-insert="÷">÷</button>
    <button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key fn" data-insert="π">π</button><button class="key op" data-insert="×">×</button>
    <button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key fn" data-insert="e">e</button><button class="key op" data-insert="−">−</button>
    <button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key fn" data-insert="!">x!</button><button class="key op" data-insert="+">+</button>
    <button class="key wide" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key special" data-action="ans">Ans</button><button class="key equals" data-action="equals">=</button>
  </section>
  <p class="foot">Kalkulator 'ilmiah' banget ga boong asli inimah.</p>
</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
